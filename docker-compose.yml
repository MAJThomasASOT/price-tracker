services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - sqlite_data:/app/data
    environment:
      PORT: 3001
      DATABASE_TYPE: sqlite
      SQLITE_PATH: /app/data/price-tracker.db
      # Override these in a .env file next to docker-compose.yml or with -e flags
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-Price Tracker <noreply@example.com>}
    restart: unless-stopped

volumes:
  sqlite_data:
